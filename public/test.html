<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Web3.js IIFE (global) for browser -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <!-- bn.js for Anchor -->
  <script src="https://unpkg.com/bn.js@5.2.1/lib/bn.js"></script>
  <!-- Anchor ESM for browser -->
  <script type="module" src="https://unpkg.com/@coral-xyz/anchor@latest/dist/browser/index.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #1f2937;
      color: white;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
  <h1 class="text-3xl font-bold mb-4">Crash Game</h1>
  <div id="wallet-button" class="mb-4">
    <button id="connect-wallet" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded">Connect Wallet</button>
  </div>
  <div id="error" class="text-red-500 mb-4 hidden"></div>
  <div id="game-state" class="bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md mb-4 hidden">
    <p id="players">Players: 0/0</p>
    <p id="multiplier">Multiplier: 0.000x</p>
    <p id="status">Status: Inactive</p>
    <p id="crash-point" class="hidden">Crash Point: 0.000x</p>
  </div>
  <div class="w-full max-w-md">
    <button id="initialize-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded mb-2" disabled>Initialize Game</button>
    <div class="flex flex-col mb-2">
      <label class="mb-1">Bet Amount (SOL):</label>
      <input id="bet-amount" type="number" value="0.01" min="0.01" step="0.01" class="bg-gray-700 text-white p-2 rounded" />
    </div>
    <button id="bet-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded mb-2" disabled>Place Bet</button>
    <button id="start-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded mb-2" disabled>Start Game</button>
    <div class="flex flex-col mb-2">
      <label class="mb-1">Cash Out Multiplier (x):</label>
      <input id="cashout-multiplier" type="number" value="1.000" min="1" step="0.001" class="bg-gray-700 text-white p-2 rounded" />
    </div>
    <button id="cashout-btn" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded mb-2" disabled>Cash Out</button>
    <button id="end-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded" disabled>End Game</button>
  </div>

  <script type="module">
    import * as anchor from 'https://unpkg.com/@coral-xyz/anchor@latest/dist/browser/index.js';
    const { Connection, PublicKey, Keypair, SystemProgram, LAMPORTS_PER_SOL } = solanaWeb3;
    const BN = window.BN;

    // IDL (full version from your earlier message)
    const idl = {
      "address": "4JnQm2avRVzUsB2yji4NWER4QVYoQdJtQ4Zy7njMk9Zs",
      "metadata": {
        "name": "crash_game",
        "version": "0.1.0",
        "spec": "0.1.0",
        "description": "Created with Anchor"
      },
      "instructions": [
        {
          "name": "initialize_game",
          "discriminator": [44, 62, 102, 247, 126, 208, 130, 215],
          "accounts": [
            { "name": "game", "writable": true, "pda": { "seeds": [{ "kind": "const", "value": [103, 97, 109, 101] }, { "kind": "account", "path": "authority" }] } },
            { "name": "authority", "writable": true, "signer": true },
            { "name": "system_program", "address": "11111111111111111111111111111111" }
          ],
          "args": [{ "name": "max_players", "type": "u8" }]
        },
        {
          "name": "place_bet",
          "discriminator": [222, 62, 67, 220, 63, 166, 126, 33],
          "accounts": [
            { "name": "game", "writable": true },
            { "name": "bet", "writable": true, "pda": { "seeds": [{ "kind": "const", "value": [98, 101, 116] }, { "kind": "account", "path": "game" }, { "kind": "account", "path": "player" }] } },
            { "name": "player", "writable": true, "signer": true },
            { "name": "escrow", "writable": true, "pda": { "seeds": [{ "kind": "const", "value": [101, 115, 99, 114, 111, 119] }, { "kind": "account", "path": "game" }] } },
            { "name": "system_program", "address": "11111111111111111111111111111111" }
          ],
          "args": [{ "name": "amount", "type": "u64" }]
        },
        {
          "name": "start_game",
          "discriminator": [249, 47, 252, 172, 184, 162, 245, 14],
          "accounts": [
            { "name": "game", "writable": true },
            { "name": "authority", "signer": true, "relations": ["game"] }
          ],
          "args": [{ "name": "crash_point", "type": "u64" }]
        },
        {
          "name": "cash_out",
          "discriminator": [1, 110, 57, 58, 159, 157, 243, 192],
          "accounts": [
            { "name": "game" },
            { "name": "bet", "writable": true },
            { "name": "player", "writable": true, "signer": true, "relations": ["bet"] },
            { "name": "escrow", "writable": true, "pda": { "seeds": [{ "kind": "const", "value": [101, 115, 99, 114, 111, 119] }, { "kind": "account", "path": "game" }] } },
            { "name": "authority", "signer": true, "relations": ["game"] }
          ],
          "args": [{ "name": "current_multiplier", "type": "u64" }]
        },
        {
          "name": "end_game",
          "discriminator": [224, 135, 245, 99, 67, 175, 121, 252],
          "accounts": [
            { "name": "game", "writable": true },
            { "name": "authority", "signer": true, "relations": ["game"] }
          ],
          "args": []
        },
        {
          "name": "add_to_escrow",
          "discriminator": [69, 162, 124, 60, 196, 57, 219, 103],
          "accounts": [
            { "name": "escrow", "writable": true, "pda": { "seeds": [{ "kind": "const", "value": [101, 115, 99, 114, 111, 119] }, { "kind": "account", "path": "game" }] } },
            { "name": "signer", "writable": true, "signer": true },
            { "name": "game", "writable": true },
            { "name": "system_program", "address": "11111111111111111111111111111111" }
          ],
          "args": [{ "name": "amount", "type": "u64" }]
        }
      ],
      "accounts": [
        { "name": "Bet", "discriminator": [147, 23, 35, 59, 15, 75, 155, 32] },
        { "name": "Escrow", "discriminator": [31, 213, 123, 187, 186, 22, 218, 155] },
        { "name": "Game", "discriminator": [27, 90, 166, 125, 74, 100, 121, 18] }
      ],
      "errors": [
        { "code": 6000, "name": "GameAlreadyActive", "msg": "Game is already active" },
        { "code": 6001, "name": "GameNotActive", "msg": "Game is not active" },
        { "code": 6002, "name": "GameFull", "msg": "Game is full" },
        { "code": 6003, "name": "BetTooLow", "msg": "Bet amount too low" },
        { "code": 6004, "name": "AlreadyCashedOut", "msg": "Player already cashed out" },
        { "code": 6005, "name": "GameCrashed", "msg": "Game has crashed" },
        { "code": 6006, "name": "InvalidCrashPoint", "msg": "Invalid crash point" },
        { "code": 6007, "name": "InvalidMultiplier", "msg": "Invalid multiplier" },
        { "code": 6008, "name": "NoPlayers", "msg": "No players in game" }
      ],
      "types": [
        {
          "name": "Bet",
          "type": {
            "kind": "struct",
            "fields": [
              { "name": "player", "type": "pubkey" },
              { "name": "amount", "type": "u64" },
              { "name": "cashout_multiplier", "type": "u64" },
              { "name": "has_cashed_out", "type": "bool" }
            ]
          }
        },
        {
          "name": "Escrow",
          "type": {
            "kind": "struct",
            "fields": [{ "name": "escrow_balance", "type": "u64" }]
          }
        },
        {
          "name": "Game",
          "type": {
            "kind": "struct",
            "fields": [
              { "name": "authority", "type": "pubkey" },
              { "name": "max_players", "type": "u8" },
              { "name": "current_players", "type": "u8" },
              { "name": "multiplier", "type": "u64" },
              { "name": "is_active", "type": "bool" },
              { "name": "crash_point", "type": "u64" }
            ]
          }
        }
      ]
    };

    const programId = new PublicKey('4JnQm2avRVzUsB2yji4NWER4QVYoQdJtQ4Zy7njMk9Zs');
    const connection = new Connection('https://api.devnet.solana.com', 'confirmed');
    let wallet = null;
    let program = null;
    let gamePublicKey = null;

    // Elements
    const walletButton = document.getElementById('wallet-button');
    const errorDiv = document.getElementById('error');
    const gameStateDiv = document.getElementById('game-state');
    const playersP = document.getElementById('players');
    const multiplierP = document.getElementById('multiplier');
    const statusP = document.getElementById('status');
    const crashPointP = document.getElementById('crash-point');
    const initializeBtn = document.getElementById('initialize-btn');
    const betBtn = document.getElementById('bet-btn');
    const startBtn = document.getElementById('start-btn');
    const cashoutBtn = document.getElementById('cashout-btn');
    const endBtn = document.getElementById('end-btn');
    const betAmountInput = document.getElementById('bet-amount');
    const cashoutMultiplierInput = document.getElementById('cashout-multiplier');

    // Multi-wallet support for Phantom and Solflare
    function setupWalletSelection() {
      walletButton.innerHTML = `
        <select id="wallet-select" class="bg-gray-700 text-white p-2 rounded">
          <option value="">Select Wallet</option>
          <option value="phantom">Phantom</option>
          <option value="solflare">Solflare</option>
        </select>
        <button id="connect-wallet" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded ml-2">Connect</button>
      `;
      const walletSelect = document.getElementById('wallet-select');
      const connectButton = document.getElementById('connect-wallet');
      connectButton.onclick = async () => {
        const walletType = walletSelect.value;
        if (!walletType) {
          setError('Please select a wallet');
          return;
        }
        await connectWallet(walletType);
      };
    }

    async function connectWallet(walletType) {
      let selectedWallet = null;
      if (walletType === 'phantom' && 'phantom' in window && window.phantom.solana) {
        selectedWallet = window.phantom.solana;
      } else if (walletType === 'solflare' && 'solflare' in window && window.solflare) {
        selectedWallet = window.solflare;
      } else {
        walletButton.innerHTML = `
          <span class="text-red-500">Install ${walletType}</span>
          <button class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded ml-2" onclick="window.open('${
            walletType === 'phantom' ? 'https://phantom.app/' : 'https://solflare.com/'
          }', '_blank')">Install</button>
        `;
        setError(`${walletType} not found. Please install the extension.`);
        return;
      }
      try {
        await selectedWallet.connect();
        wallet = {
          publicKey: selectedWallet.publicKey,
          signTransaction: async (tx) => await selectedWallet.signTransaction(tx),
          signAllTransactions: async (txs) => await selectedWallet.signAllTransactions(txs),
        };
        const provider = new anchor.AnchorProvider(connection, wallet, { commitment: 'confirmed' });
        anchor.setProvider(provider);
        program = new anchor.Program(idl, programId, provider);
        walletButton.innerHTML = `<span class="bg-green-600 text-white py-2 px-4 rounded">Connected with ${walletType}: ${selectedWallet.publicKey.toString().slice(0, 8)}...</span>`;
        initializeBtn.disabled = false;
        setError('');
      } catch (err) {
        setError(`${walletType} connection failed: ${err.message}`);
      }
    }

    function setError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.toggle('hidden', !message);
    }

    async function fetchGameState(gameKey) {
      if (!program) return;
      try {
        const game = await program.account.game.fetch(gameKey);
        gameStateDiv.classList.remove('hidden');
        playersP.textContent = `Players: ${game.currentPlayers}/${game.maxPlayers}`;
        multiplierP.textContent = `Multiplier: ${(game.multiplier / 1000).toFixed(3)}x`;
        statusP.textContent = `Status: ${game.isActive ? 'Active' : 'Inactive'}`;
        crashPointP.classList.toggle('hidden', !game.isActive);
        if (game.isActive) {
          crashPointP.textContent = `Crash Point: ${(game.crashPoint / 1000).toFixed(3)}x`;
        }
      } catch (err) {
        setError('Error fetching game state: ' + err.message);
      }
    }

    initializeBtn.onclick = async () => {
      if (!program || !wallet) {
        setError('Connect wallet first');
        return;
      }
      const gameKeypair = Keypair.generate();
      try {
        await program.methods
          .initializeGame(8)
          .accounts({
            game: gameKeypair.publicKey,
            authority: wallet.publicKey,
            systemProgram: SystemProgram.programId,
          })
          .signers([gameKeypair])
          .rpc();
        gamePublicKey = gameKeypair.publicKey;
        await fetchGameState(gamePublicKey);
        betBtn.disabled = false;
        startBtn.disabled = false;
        cashoutBtn.disabled = false;
        endBtn.disabled = false;
        setError('');
      } catch (err) {
        setError('Error initializing game: ' + err.message);
      }
    };

    betBtn.onclick = async () => {
      if (!program || !wallet || !gamePublicKey) {
        setError('Initialize game and connect wallet first');
        return;
      }
      const [escrowPda] = PublicKey.findProgramAddressSync(
        [Buffer.from('escrow'), gamePublicKey.toBuffer()],
        programId
      );
      const [betPda] = PublicKey.findProgramAddressSync(
        [Buffer.from('bet'), gamePublicKey.toBuffer(), wallet.publicKey.toBuffer()],
        programId
      );
      try {
        const amount = new BN(parseFloat(betAmountInput.value) * LAMPORTS_PER_SOL);
        await program.methods
          .placeBet(amount)
          .accounts({
            game: gamePublicKey,
            bet: betPda,
            player: wallet.publicKey,
            escrow: escrowPda,
            systemProgram: SystemProgram.programId,
          })
          .rpc();
        await fetchGameState(gamePublicKey);
        setError('');
      } catch (err) {
        setError('Error placing bet: ' + err.message);
      }
    };

    startBtn.onclick = async () => {
      if (!program || !wallet || !gamePublicKey) {
        setError('Initialize game and connect wallet first');
        return;
      }
      try {
        await program.methods
          .startGame(new BN(2000)) // 2x crash point
          .accounts({
            game: gamePublicKey,
            authority: wallet.publicKey,
          })
          .rpc();
        await fetchGameState(gamePublicKey);
        setError('');
      } catch (err) {
        setError('Error starting game: ' + err.message);
      }
    };

    cashoutBtn.onclick = async () => {
      if (!program || !wallet || !gamePublicKey) {
        setError('Initialize game and connect wallet first');
        return;
      }
      const [escrowPda] = PublicKey.findProgramAddressSync(
        [Buffer.from('escrow'), gamePublicKey.toBuffer()],
        programId
      );
      const [betPda] = PublicKey.findProgramAddressSync(
        [Buffer.from('bet'), gamePublicKey.toBuffer(), wallet.publicKey.toBuffer()],
        programId
      );
      try {
        const multiplierVal = new BN(parseFloat(cashoutMultiplierInput.value) * 1000);
        await program.methods
          .cashOut(multiplierVal)
          .accounts({
            game: gamePublicKey,
            bet: betPda,
            player: wallet.publicKey,
            escrow: escrowPda,
            authority: wallet.publicKey,
          })
          .rpc();
        await fetchGameState(gamePublicKey);
        setError('');
      } catch (err) {
        setError('Error cashing out: ' + err.message);
      }
    };

    endBtn.onclick = async () => {
      if (!program || !wallet || !gamePublicKey) {
        setError('Initialize game and connect wallet first');
        return;
      }
      try {
        await program.methods
          .endGame()
          .accounts({
            game: gamePublicKey,
            authority: wallet.publicKey,
          })
          .rpc();
        gamePublicKey = null;
        gameStateDiv.classList.add('hidden');
        betBtn.disabled = true;
        startBtn.disabled = true;
        cashoutBtn.disabled = true;
        endBtn.disabled = true;
        setError('');
      } catch (err) {
        setError('Error ending game: ' + err.message);
      }
    };

    // Initialize wallet selection
    setupWalletSelection();
  </script>
</body>
</html>
